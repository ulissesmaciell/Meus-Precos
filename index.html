<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meus Preços</title>
<meta name="description" content="Anote quanto pagou em cada produto e compare com o preço de hoje.">
<meta name="theme-color" content="#2f55d4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meus Preços">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: uma coluna, lista de produtos estilo cupom fiscal; detalhe abre numa folha de baixo pra cima */
:root{
  --bg:#f2f3ef; --surface:#ffffff; --ink:#151a17; --muted:#5d6660; --line:#dcdfd8;
  --accent:#2f55d4; --accent-ink:#ffffff;
  --up:#b8322a; --up-bg:#fbe8e5; --down:#13744a; --down-bg:#e1f2e8; --neutral-bg:#ecede9;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1210; --surface:#181c19; --ink:#edf0ed; --muted:#9aa39c; --line:#2a302c;
    --accent:#86a2ff; --accent-ink:#0b1330;
    --up:#ff8576; --up-bg:#3a1d1a; --down:#55d394; --down-bg:#123021; --neutral-bg:#232824;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1210; --surface:#181c19; --ink:#edf0ed; --muted:#9aa39c; --line:#2a302c;
  --accent:#86a2ff; --accent-ink:#0b1330;
  --up:#ff8576; --up-bg:#3a1d1a; --down:#55d394; --down-bg:#123021; --neutral-bg:#232824;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 96px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:30px;line-height:1.05}
h2{font-size:24px;line-height:1.1}
h3{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-family:var(--f-body);font-weight:600}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.near{display:flex;flex-wrap:wrap;gap:6px}
.near:empty{display:none}
.near-chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600;display:inline-flex;gap:6px;align-items:baseline}
.near-chip small{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-weight:500}
.near-chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{flex-direction:column;align-items:stretch}
.top-btns{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:8px}
.top-btns .btn{padding:11px 8px;white-space:nowrap}
.ean{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.04em}
.ean-row{display:flex;gap:8px}
.ean-row .btn{flex-shrink:0;padding:10px 12px}
.scan-wait{position:fixed;inset:0;background:rgba(10,14,12,.55);display:flex;align-items:center;justify-content:center;z-index:30;color:#fff;font-weight:600}
.scan-wait[hidden],.cam[hidden]{display:none}
.cam{position:fixed;inset:0;background:#000;z-index:40;display:flex;flex-direction:column}
.cam video{flex:1;width:100%;min-height:0;object-fit:cover}
.cam .frame{position:absolute;left:6%;right:6%;top:34%;height:24%;border:4px solid #fff;border-radius:16px;box-shadow:0 0 0 9999px rgba(0,0,0,.45);pointer-events:none;transition:border-color .15s, box-shadow .15s}
.cam .laser{position:absolute;left:5%;right:5%;height:3px;border-radius:2px;background:#ff3b30;box-shadow:0 0 12px 3px rgba(255,59,48,.75);top:10%;animation:laser 1.4s ease-in-out infinite alternate}
@keyframes laser{from{top:10%}to{top:88%}}
.cam.scanning .frame{animation:glow 1.2s ease-in-out infinite}
@keyframes glow{0%,100%{border-color:#fff}50%{border-color:#9fd3ff}}
.cam.found .frame{border-color:#ffcc00;animation:none;box-shadow:0 0 0 9999px rgba(0,0,0,.45),0 0 24px 6px rgba(255,204,0,.6)}
.cam.found .laser{background:#ffcc00;box-shadow:0 0 12px 3px rgba(255,204,0,.8)}
.cam.done .frame{border-color:#34c759;border-width:6px;animation:none;box-shadow:0 0 0 9999px rgba(0,0,0,.45),0 0 32px 10px rgba(52,199,89,.75)}
.cam.done .laser{display:none}
.cam.done::after{content:"";position:absolute;inset:0;background:rgba(52,199,89,.28);pointer-events:none;animation:flash .45s ease-out forwards}
@keyframes flash{from{opacity:1}to{opacity:0}}
.cam .caption{position:absolute;left:12px;right:12px;top:calc(34% - 84px);display:flex;justify-content:center;pointer-events:none}
.cam .caption span{background:rgba(0,0,0,.72);color:#fff;font-size:22px;font-weight:700;line-height:1.25;padding:12px 20px;border-radius:999px;text-align:center;font-family:var(--f-body)}
.cam.found .caption span{background:#ffcc00;color:#1a1a1a}
.cam.done .caption span{background:#34c759;color:#06210f;font-size:24px}
.cam .tip{position:absolute;left:16px;right:16px;top:calc(58% + 18px);margin:0;text-align:center;color:#fff;font-size:17px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.8)}
@media (prefers-reduced-motion: reduce){.cam .laser,.cam.scanning .frame{animation:none}.cam .laser{top:50%}}
.cam-msg{position:absolute;left:16px;right:16px;top:64px;background:rgba(0,0,0,.8);color:#fff;padding:14px 16px;border-radius:12px;font-size:15px;line-height:1.4;margin:0}
.cam-msg[hidden]{display:none}
.cam .bar{display:flex;gap:10px;padding:16px;justify-content:center;background:#000}
.cam .btn{background:#222;color:#fff;border-color:#444}
.status{margin:4px 0 0;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--down)}
.status.warn::before{background:#d29a1e}
.status.wait::before{background:var(--line)}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.wide{width:100%;padding:13px 16px}
.btn.danger{color:var(--up);border-color:transparent;background:transparent}
.btn:focus-visible,input:focus-visible,.card:focus-visible,.seg button:focus-visible,.x:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-width:0}
input::placeholder{color:var(--muted);opacity:.8}
.tools input{flex:1 1 200px}
.seg{display:inline-flex;background:var(--neutral-bg);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;cursor:pointer;border-bottom:1px dashed var(--line)}
.card:last-child{border-bottom:0}
.card:hover{background:color-mix(in srgb,var(--accent) 5%,var(--surface))}
.c-main{display:flex;flex-direction:column;min-width:0;gap:2px}
.c-name{font-weight:600;overflow-wrap:anywhere}
.c-meta{font-size:13px;color:var(--muted)}
.c-price{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.c-price .mono{font-size:17px;font-weight:700}
.chip{font-family:var(--f-mono);font-size:12px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap;background:var(--neutral-bg);color:var(--muted)}
.chip.up{background:var(--up-bg);color:var(--up)}
.chip.down{background:var(--down-bg);color:var(--down)}
.empty{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 18px;display:flex;flex-direction:column;gap:14px}
.empty p{margin:0;color:var(--muted)}
.example{border:1px dashed var(--line);border-radius:10px;opacity:.75;position:relative}
.example .tag{position:absolute;top:-9px;left:12px;background:var(--surface);padding:0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.example .card{cursor:default}
.count{font-size:13px;color:var(--muted)}
/* Folha */
.overlay{position:fixed;inset:0;background:rgba(10,14,12,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.overlay[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 16px 28px;display:flex;flex-direction:column;gap:16px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.sheet-head p{margin:4px 0 0;color:var(--muted);font-size:14px}
.x{border:0;background:var(--neutral-bg);border-radius:50%;width:36px;height:36px;font-size:20px;line-height:1;flex-shrink:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat span{font-size:12px;color:var(--muted)}
.stat strong{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:16px}
.stat small{font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.spark{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.spark svg{display:block;width:100%;height:auto}
.slip{background:var(--surface);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);position:relative}
.slip::before{content:"";position:absolute;left:12px;right:12px;top:-1px;border-top:2px dashed var(--bg)}
.slip label,.field label{font-size:13px;font-weight:600;color:var(--muted)}
.money{display:flex;align-items:center;gap:8px;border:2px solid var(--ink);border-radius:12px;padding:4px 12px;background:var(--surface)}
.money span{font-family:var(--f-mono);font-weight:700;color:var(--muted)}
.money input{border:0;padding:8px 0;font-family:var(--f-mono);font-size:26px;font-weight:700;background:transparent}
.money input:focus-visible{outline:none}
.money:focus-within{border-color:var(--accent)}
.cmp{border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);padding:12px 0;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.cmp .big{font-family:var(--f-mono);font-size:18px;font-weight:700;color:var(--ink)}
.cmp .big.up{color:var(--up)} .cmp .big.down{color:var(--down)}
.cmp .best{font-weight:600;color:var(--down)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field{display:flex;flex-direction:column;gap:6px}
.hist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sug{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--accent);border-radius:10px;overflow:hidden;margin-top:-2px}
.sug[hidden]{display:none}
.sug .sug-h{font-size:12px;color:var(--muted);padding:8px 12px 4px}
.sug button{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 12px;border-top:1px dashed var(--line);cursor:pointer}
.sug button:hover{background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.sug button:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.sug .n{font-weight:600;overflow-wrap:anywhere}
.sug .n small{font-weight:400;color:var(--muted)}
.sug .v{font-family:var(--f-mono);font-size:13px;color:var(--muted);white-space:nowrap}
.wrow{display:flex;gap:6px}
.wrow input{flex:1}
.wrow select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 10px}
.money.sm input{font-size:18px;padding:6px 0}
.money .suf{font-size:13px}
.check{display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--accent);flex-shrink:0;margin:0}
.check small{font-weight:400;color:var(--muted)}
.hist .w{display:block;font-family:var(--f-mono);font-size:12px;font-weight:400;color:var(--muted)}
.scan-wait-box{display:flex;align-items:center;gap:12px;background:rgba(0,0,0,.75);padding:16px 20px;border-radius:14px;font-size:17px;max-width:86%;text-align:left}
.spinner{width:22px;height:22px;border-radius:50%;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;animation:spin .8s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.rc-list{display:flex;flex-direction:column;gap:10px}
.rc-item{display:flex;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.rc-item.off{opacity:.45}
.rc-item.warn{border-color:#d29a1e}
.rc-on input{width:22px;height:22px;accent-color:var(--accent);margin:2px 0 0}
.rc-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.rc-name{font-weight:600}
.rc-desc{color:var(--muted);font-family:var(--f-mono);font-size:11px;overflow-wrap:anywhere}
.rc-match,.rc-kg{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;max-width:100%}
.rc-nums{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rc-nums input{width:84px;padding:8px 10px;font-family:var(--f-mono)}
.rc-nums .rc-kg{padding:8px 6px}
.rc-tot{font-weight:700;margin-left:auto}
.rc-warn{color:#b07a10;font-size:12px}
#rcSum .ok{color:var(--down)}
.row-edit{all:unset;box-sizing:border-box;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;cursor:pointer;min-width:0}
.row-edit:focus-visible{outline:3px solid var(--accent);outline-offset:4px;border-radius:6px}
h3 small{font-weight:500;text-transform:none;letter-spacing:0;font-size:12px}
.head-btns{display:flex;gap:8px;align-items:center;flex-shrink:0}
.btn.sm{padding:7px 14px;font-size:14px}
.btn-col{display:flex;flex-direction:column;gap:8px}
.hist li{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px dashed var(--line);font-size:14px}
.hist li:last-child{border-bottom:0}
.hist .d{font-family:var(--f-mono);color:var(--muted);font-size:13px}
.hist .s{color:var(--muted);overflow-wrap:anywhere}
.hist .p{font-family:var(--f-mono);font-weight:700}
.hist .del{border:0;background:transparent;color:var(--muted);font-size:18px;width:28px;height:28px;border-radius:50%}
.hist .del:hover{background:var(--up-bg);color:var(--up)}
.err{color:var(--up);font-size:13px;min-height:1em;margin:0}
body.in-claude #expBtn,body.in-claude .site-only{display:none}
body:not(.in-claude) .claude-only{display:none}
.backup{display:flex;flex-direction:column;gap:10px;padding-top:8px;border-top:1px dashed var(--line)}
.backup p{margin:0;font-size:13px;color:var(--muted)}
.backup-btns{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media (max-width:400px){.stats{grid-template-columns:1fr 1fr}.stats .stat:first-child{grid-column:1/-1}h1{font-size:26px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Meus Preços</h1>
      <p id="status" class="status wait">Carregando…</p>
    </div>
    <div class="top-btns">
      <button id="scanBtn" class="btn" type="button" aria-label="Ler código de barras"><svg width="20" height="16" viewBox="0 0 20 16" aria-hidden="true"><path d="M1 1v14M4 1v14M6 1v14M9 1v14M12 1v14M13.5 1v14M16 1v14M19 1v14" stroke="currentColor" stroke-width="1.6"/></svg> Código</button>
      <button id="rcBtn" class="btn" type="button" data-receipt aria-label="Ler nota fiscal por foto">📄 Nota</button>
      <button id="addBtn" class="btn primary" type="button">+ Produto</button>
    </div>
  </header>
  <input id="scanFile" type="file" accept="image/*" capture="environment" hidden>
  <input id="receiptFile" type="file" accept="image/*" multiple hidden>
  <div class="tools">
    <input id="q" type="search" placeholder="Buscar produto…" aria-label="Buscar produto" autocomplete="off">
    <div class="seg" role="group" aria-label="Ordenar">
      <button type="button" data-sort="recent" aria-pressed="true">Recentes</button>
      <button type="button" data-sort="az" aria-pressed="false">A–Z</button>
    </div>
  </div>
  <main id="list"></main>
  <footer class="backup">
    <p class="site-only">Os dados ficam só neste aparelho. Faça backup de vez em quando.</p>
    <p class="claude-only">Os dados ficam salvos na sua conta Claude. Dá pra trazer um backup do app do celular com <b>Restaurar backup</b>.</p>
    <div class="backup-btns">
      <button id="expBtn" class="btn" type="button">Fazer backup</button>
      <button id="impBtn" class="btn" type="button">Restaurar backup</button>
      <input id="impFile" type="file" accept="application/json,.json" hidden>
    </div>
  </footer>
</div>

<div id="overlay" class="overlay" hidden>
  <div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
</div>
<datalist id="stores"></datalist>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="scanWait" class="scan-wait" hidden><div class="scan-wait-box"><span class="spinner" aria-hidden="true"></span><span id="scanWaitText">Lendo o código…</span></div></div>
<div id="cam" class="cam" hidden role="dialog" aria-label="Leitor de código de barras">
  <video id="camVideo" playsinline muted autoplay></video>
  <div class="frame"><div class="laser"></div></div>
  <div class="caption" aria-live="polite"><span id="camHintText">Abrindo a câmera…</span></div>
  <p class="tip" id="camTip">Deixe o código dentro da moldura</p>
  <p id="camMsg" class="cam-msg" hidden role="alert"></p>
  <div class="bar">
    <button id="camPhoto" class="btn" type="button">Usar foto</button>
    <button id="camClose" class="btn" type="button">Cancelar</button>
  </div>
</div>

<script>
(function(){
const $ = s => document.querySelector(s);
const BRL = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const PCT = new Intl.NumberFormat('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});
const BRL3 = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2,maximumFractionDigits:3});
const fmt = v => (Math.round(v*1000) % 10 ? BRL3 : BRL).format(v);
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => { const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const fdate = s => { if(!s) return ''; const [y,m,d]=s.split('-'); return `${d}/${m}/${y.slice(2)}`; };
const newId = () => 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
function parsePrice(s){
  s = String(s||'').replace(/[R$\s]/g,'');
  if(s.includes(',')) s = s.replace(/\./g,'').replace(',','.');
  const v = parseFloat(s);
  return isFinite(v) && v > 0 ? Math.round(v*1000)/1000 : null;
}
function hist(p){
  return (p.entries||[]).map((e,i)=>({...e,_i:i}))
    .sort((a,b)=> a.d<b.d?-1 : a.d>b.d?1 : a._i-b._i);
}
function delta(cur, prev){
  const diff = Math.round((cur-prev)*1000)/1000;
  const pct = prev ? diff/prev*100 : 0;
  return {diff, pct, dir: Math.abs(diff) < 0.005 ? 'same' : diff > 0 ? 'up' : 'down'};
}
function chipFor(d){
  if(!d) return '<span class="chip">1ª compra</span>';
  if(d.dir==='same') return '<span class="chip">= igual</span>';
  const sign = d.dir==='up' ? '▲ +' : '▼ −';
  return `<span class="chip ${d.dir}">${sign}${PCT.format(Math.abs(d.pct))}%</span>`;
}

// O mesmo arquivo roda no site (dados no aparelho) e no artefato do Claude (dados na conta Claude)
const IN_CLAUDE = !!(window.claude && typeof window.claude.use === 'function');
let items = new Map(), mode = 'loading', col = null, loaded = false;
let sortBy = 'recent', query = '', openId = null, view = null;
const chains = {};
const LKEY = 'meusprecos.v1';

function setStatus(text, kind){ const el=$('#status'); el.textContent=text; el.className='status'+(kind?' '+kind:''); }
function loadLocal(){
  try{ const raw = localStorage.getItem(LKEY); if(raw){ const o=JSON.parse(raw); items=new Map(Object.entries(o).map(([k,v])=>[k,{...v,id:k}])); } }catch(e){}
}
function saveLocal(){
  try{ const o={}; items.forEach((v,k)=>{ const {id,...b}=v; o[k]=b; }); localStorage.setItem(LKEY, JSON.stringify(o)); }
  catch(e){ setStatus('Não consegui salvar neste navegador','warn'); }
}
function dbError(e){
  const c = e && e.code;
  if(c==='quota_exceeded') toast('Espaço cheio: exclua produtos antigos');
  else if(c==='invalid_argument') { setStatus('Sem permissão para salvar aqui','warn'); toast('Não foi possível salvar'); }
  else toast('Falha ao salvar. Tente de novo.');
}
function persist(p){
  items.set(p.id, p);
  renderAll();
  if(mode==='db'){
    const {id, ...body} = JSON.parse(JSON.stringify(p));
    chains[p.id] = (chains[p.id]||Promise.resolve()).then(()=>col.doc(p.id).set(body)).catch(dbError);
  } else saveLocal();
}
function removeProduct(id){
  items.delete(id);
  renderAll();
  if(mode==='db') chains[id] = (chains[id]||Promise.resolve()).then(()=>col.doc(id).delete()).catch(dbError);
  else saveLocal();
}
async function init(){
  if(IN_CLAUDE){
    document.body.classList.add('in-claude');
    setStatus('Conectando…','wait'); renderAll();
    let db=null, user=null, uid=null;
    try{ [db,user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); }catch(e){}
    if(db && user){ try{ uid = await user.id(); }catch(e){} }
    if(db && uid){
      mode='db'; col = db.collection('data/users/'+uid);
      const t = setTimeout(()=>setStatus('Sem conexão; os dados podem estar desatualizados','warn'), 10000);
      col.onSnapshot(snap=>{
        items = new Map(snap.docs.map(d=>[d.id,{...d.data(), id:d.id}]));
        loaded = true;
        if(!snap.metadata.fromCache){ clearTimeout(t); setStatus('Salvo na sua conta Claude'); }
        renderAll();
      }, err=>{ clearTimeout(t); loaded = true; setStatus('Não consegui carregar seus dados ('+err.code+')','warn'); renderAll(); });
      return;
    }
  }
  mode='local'; loadLocal(); loaded=true;
  try{ localStorage.setItem(LKEY+'.t','1'); localStorage.removeItem(LKEY+'.t'); setStatus('Salvo neste aparelho'); }
  catch(e){ setStatus('Este navegador não está salvando os dados','warn'); }
  if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
  renderAll();
}

/* ---------- Backup ---------- */
function exportBackup(){
  const o={}; items.forEach((v,k)=>{ const {id,...b}=v; o[k]=b; });
  const blob = new Blob([JSON.stringify({app:'meus-precos',v:1,exported:new Date().toISOString(),products:o},null,1)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'meus-precos-backup-'+today()+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  toast('Backup baixado');
}
function importBackup(file){
  const r = new FileReader();
  r.onload = () => {
    try{
      const data = JSON.parse(r.result);
      const prods = data && data.products;
      if(!prods || typeof prods!=='object') throw 0;
      let n=0;
      Object.entries(prods).forEach(([k,v])=>{
        if(!v || !v.name || !Array.isArray(v.entries)) return;
        const cur = items.get(k);
        if(cur){
          const seen = new Set(cur.entries.map(e=>e.d+'|'+e.p+'|'+(e.s||'')));
          const add = v.entries.filter(e=>!seen.has(e.d+'|'+e.p+'|'+(e.s||'')));
          if(add.length) persist({...cur, entries:[...cur.entries,...add], updated:Date.now()});
        } else persist({...v,id:k});
        n++;
      });
      renderAll(); toast(n+' produtos restaurados');
    }catch(e){ toast('Arquivo de backup inválido'); }
  };
  r.readAsText(file);
}

/* ---------- Lista ---------- */
function cardHTML(p, example){
  const h = hist(p), last = h[h.length-1], prev = h[h.length-2];
  const d = last && prev ? delta(last.p, prev.p) : null;
  const meta = [p.unit || (p.byWeight ? 'por peso' : ''), last && last.s, last && fdate(last.d)].filter(Boolean).map(esc).join(' · ');
  const tag = example ? 'div' : 'button';
  return `<${tag} class="card" ${example?'':`type="button" data-open="${esc(p.id)}"`}>
    <span class="c-main"><span class="c-name">${esc(p.name)}</span><span class="c-meta">${meta}</span></span>
    <span class="c-price"><span class="mono">${last?fmtU(last.p,p):'—'}</span>${chipFor(d)}</span>
  </${tag}>`;
}
function renderList(){
  const el = $('#list');
  if(!loaded){ el.innerHTML = '<div class="empty"><p>Carregando seus preços…</p></div>'; return; }
  const q = query.trim().toLowerCase();
  let arr = [...items.values()];
  if(!arr.length){
    const ex = {id:'ex',name:'Café torrado 500 g',unit:'pacote',entries:[{p:17.9,d:'2026-10-03',s:'Mercadinho'},{p:19.49,d:'2026-11-07',s:'Mercadinho'}]};
    el.innerHTML = `<div class="empty">
      <h2>Comece pelo que você compra sempre</h2>
      <p>Mercado, farmácia, posto, pet shop, loja de construção: cadastre qualquer produto com o preço que pagou. Na próxima compra, abra ele, digite o preço de hoje e veja na hora se subiu ou caiu.</p>
      <div class="example"><span class="tag">Exemplo</span>${cardHTML(ex,true)}</div>
      <button class="btn primary wide" type="button" data-add>Cadastrar primeiro produto</button>
    </div>`;
    return;
  }
  if(q) arr = arr.filter(p => (p.name||'').toLowerCase().includes(q) || (p.unit||'').toLowerCase().includes(q) || (p.ean||'').includes(q));
  const lastOf = p => { const h=hist(p); return h.length ? h[h.length-1].d : ''; };
  arr.sort(sortBy==='az'
    ? (a,b)=> (a.name||'').localeCompare(b.name||'','pt-BR')
    : (a,b)=> lastOf(b).localeCompare(lastOf(a)) || (b.updated||0)-(a.updated||0));
  if(!arr.length){ el.innerHTML = `<div class="empty"><p>Nenhum produto com “${esc(query)}”.</p><button class="btn" type="button" data-add>Cadastrar “${esc(query)}”</button></div>`; return; }
  el.innerHTML = `<p class="count">${arr.length} ${arr.length===1?'produto':'produtos'}</p><div class="list">${arr.map(p=>cardHTML(p)).join('')}</div>`;
}
function renderStores(){
  const set = new Set();
  items.forEach(p => (p.entries||[]).forEach(e => e.s && set.add(e.s)));
  $('#stores').innerHTML = [...set].sort((a,b)=>a.localeCompare(b,'pt-BR')).map(s=>`<option value="${esc(s)}">`).join('');
}
function renderAll(){
  renderList(); renderStores();
  if(view==='detail'){
    if(items.has(openId)) renderDetailParts(); else closeSheet();
  } else if((view==='editProduct' || view==='editEntry') && !items.has(openId)) closeSheet();
}

/* ---------- Folha: detalhe ---------- */
function sparkSVG(h){
  if(h.length < 2) return '<p class="count" style="margin:0">O gráfico aparece a partir da 2ª compra.</p>';
  const W=320, H=96, px=8, top=14, bot=20;
  const vals = h.map(e=>e.p), mn=Math.min(...vals), mx=Math.max(...vals);
  const span = mx-mn || 1;
  const x = i => px + i*(W-2*px)/(h.length-1);
  const y = v => mx===mn ? (top+(H-bot))/2 : top + (mx-v)/span*(H-top-bot);
  const pts = h.map((e,i)=>`${x(i).toFixed(1)},${y(e.p).toFixed(1)}`);
  const area = `M${x(0)},${H-bot} L${pts.join(' L')} L${x(h.length-1)},${H-bot} Z`;
  const lx = x(h.length-1), ly = y(vals[vals.length-1]);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolução do preço">
    <line x1="${px}" x2="${W-px}" y1="${y(mx)}" y2="${y(mx)}" stroke="var(--line)" stroke-dasharray="3 4"/>
    <line x1="${px}" x2="${W-px}" y1="${y(mn)}" y2="${y(mn)}" stroke="var(--line)" stroke-dasharray="3 4"/>
    <path d="${area}" fill="var(--accent)" opacity=".12"/>
    <polyline points="${pts.join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${lx}" cy="${ly}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
    <text x="${px}" y="${H-5}" font-size="10" fill="var(--muted)" font-family="var(--f-mono)">${fdate(h[0].d)}</text>
    <text x="${W-px}" y="${H-5}" font-size="10" fill="var(--muted)" font-family="var(--f-mono)" text-anchor="end">${fdate(h[h.length-1].d)}</text>
    <text x="${W-px}" y="${Math.max(10,y(mx)-4)}" font-size="10" fill="var(--muted)" font-family="var(--f-mono)" text-anchor="end">${fmt(mx)}</text>
    ${mx!==mn?`<text x="${W-px}" y="${y(mn)+12}" font-size="10" fill="var(--muted)" font-family="var(--f-mono)" text-anchor="end">${fmt(mn)}</text>`:''}
  </svg>`;
}

function renderDetailParts(){
  const p = items.get(openId); if(!p) return;
  const h = hist(p), last = h[h.length-1];
  if(!h.length){ $('#dStats').innerHTML=''; $('#dSpark').innerHTML=sparkSVG(h); $('#dHist').innerHTML='<li><span class="s">Sem compras registradas.</span></li>'; renderCmp(); return; }

  const avg = h.reduce((s,e)=>s+e.p,0)/h.length;
  $('#dStats').innerHTML = `
    <div class="stat"><span>Último pago</span><strong>${fmtU(last.p,p)}</strong><small>${esc([fdate(last.d), last.s].filter(Boolean).join(' · '))}</small></div>

    <div class="stat"><span>Média</span><strong>${fmtU(avg,p)}</strong><small>${h.length} ${h.length===1?'compra':'compras'}</small></div>`;
  $('#dSpark').innerHTML = sparkSVG(h);
  $('#dHist').innerHTML = h.slice().reverse().map((e,idx,arr)=>{
    const prev = arr[idx+1];
    const d = prev ? delta(e.p, prev.p) : null;
    return `<li><button class="row-edit" type="button" data-edit-entry="${e._i}" aria-label="Editar compra de ${fdate(e.d)}"><span class="d">${fdate(e.d)}</span><span class="s">${esc(e.s||'—')}</span>
      <span class="p">${fmtU(e.p,p)} ${d?chipFor(d):''}${p.byWeight && e.w ? `<span class="w">${fmtW(e.w)}${e.t?' = '+fmt(e.t):''}</span>` : ''}</span></button>
      <button class="del" type="button" data-del-entry="${e._i}" aria-label="Apagar compra de ${fdate(e.d)}">×</button></li>`;
  }).join('');
  renderCmp();
}
function renderCmp(){
  const out = $('#cmpOut'); if(!out) return;
  const p = items.get(openId); const h = hist(p);
  const tv = p.byWeight ? readTrio('cmpPrice') : null;
  const v = p.byWeight ? (tv ? tv.p : null) : parsePrice($('#cmpPrice').value);
  const U = unitOf(p);
  if(!h.length){ out.innerHTML = 'Digite o preço e registre a primeira compra.'; return; }
  const last = h[h.length-1];
  if(v===null){ out.innerHTML = `Digite o preço de hoje para comparar com os <span class="mono">${fmtU(last.p,p)}</span> que você pagou em ${fdate(last.d)}.`; return; }
  const d = delta(v, last.p);
  const min = h.reduce((a,e)=> e.p < a.p ? e : a, h[0]);
  let big;
  if(d.dir==='same') big = `<span class="big">Mesmo preço da última vez</span>`;
  else if(d.dir==='up') big = `<span class="big up">▲ ${fmt(d.diff)}${U} mais caro (+${PCT.format(d.pct)}%)</span>`;
  else big = `<span class="big down">▼ ${fmt(-d.diff)}${U} mais barato (−${PCT.format(-d.pct)}%)</span>`;
  if(p.byWeight && tv && tv.w && d.dir!=='same'){ const x = Math.round(Math.abs(d.diff*tv.w)*100)/100; big += `<span>Nessa quantidade (${fmtW(tv.w)}): ${fmt(x)} ${d.dir==='up'?'a mais':'a menos'} que da última vez.</span>`; }
  let line2;
  if(v < min.p - 0.004) line2 = `<span class="best">É o menor preço que você já registrou para este produto.</span>`;
  else if(Math.abs(v-min.p) < 0.005) line2 = `Igual ao menor preço já pago (${fdate(min.d)}${min.s?', '+esc(min.s):''}).`;
  else { const dm = delta(v, min.p); line2 = `Menor já pago: <span class="mono">${fmtU(min.p,p)}</span> em ${fdate(min.d)}${min.s?' ('+esc(min.s)+')':''}, hoje está ${PCT.format(dm.pct)}% acima.`; }
  out.innerHTML = `${big}<span>Última compra: <span class="mono">${fmtU(last.p,p)}</span> em ${fdate(last.d)}${last.s?' · '+esc(last.s):''}</span><span>${line2}</span>`;
}
function saveBuy(){
  const p = items.get(openId);
  let e;
  if(p.byWeight){
    const r = readTrio('cmpPrice');
    if(!r){ $('#cmpErr').textContent = 'Preencha o preço do kg, ou o peso e o total pago.'; $('#cmpPrice').focus(); return; }
    e = {...r, d:$('#cmpDate').value || today(), s:$('#cmpStore').value.trim()};
  } else {
    const v = parsePrice($('#cmpPrice').value);
    if(v===null){ $('#cmpErr').textContent = 'Digite um preço válido, ex.: 12,90'; $('#cmpPrice').focus(); return; }
    e = {p:v, d:$('#cmpDate').value || today(), s:$('#cmpStore').value.trim()};
  }
  if(e.s && e.d===today()){ setTrip(e.s); learnPlace(e.s); }
  persist({...p, entries:[...(p.entries||[]), e], updated:Date.now()});
  if(p.byWeight) clearTrio('cmpPrice'); else $('#cmpPrice').value='';
  $('#cmpErr').textContent='';
  renderCmp();
  toast('Compra registrada');
}

/* ---------- Busca do nome pelo código (bases públicas Open Food Facts) ---------- */
const lookupCache = {};
async function lookupProduct(code){
  if(code in lookupCache) return lookupCache[code];
  const bases = ['https://world.openfoodfacts.org','https://world.openproductsfacts.org','https://world.openbeautyfacts.org'];
  for(const b of bases){
    try{
      const ctl = new AbortController(); const t = setTimeout(()=>ctl.abort(), 6000);
      const r = await fetch(`${b}/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name_pt,product_name,generic_name_pt,brands,quantity`, {signal:ctl.signal});
      clearTimeout(t);
      if(!r.ok) continue;
      const j = await r.json();
      const p = j && j.status===1 && j.product;
      if(!p) continue;
      const name = String(p.product_name_pt || p.product_name || p.generic_name_pt || '').trim();
      if(!name) continue;
      const brand = String(p.brands||'').split(',')[0].trim();
      const full = brand && !name.toLowerCase().includes(brand.toLowerCase()) ? `${name} ${brand}` : name;
      return lookupCache[code] = {name: full, unit: String(p.quantity||'').trim()};
    }catch(e){}
  }
  if(navigator.onLine !== false) lookupCache[code] = null;
  return null;
}
async function autofill(code){
  const hint = $('#fLookup'); if(!hint || !/^\d{8,14}$/.test(code)) return;
  if(findByEan(code)) return;
  hint.textContent = 'Buscando o nome do produto…';
  const info = await lookupProduct(code);
  if(!$('#fEan') || $('#fEan').value.replace(/\s/g,'') !== code) return;
  if(info){
    if(!$('#fName').value.trim()) $('#fName').value = info.name;
    if(!$('#fUnit').value.trim() && info.unit) $('#fUnit').value = info.unit;
    hint.textContent = 'Nome preenchido automaticamente. Confira e ajuste se quiser.';
    $('#fPrice').focus();
  } else {
    hint.textContent = navigator.onLine === false
      ? 'Sem internet para buscar o nome. Digite o nome do produto.'
      : 'Não achei esse código na base pública. Digite o nome uma vez e o app guarda.';
  }
}
function submitAdd(ev){
  ev.preventDefault();
  const name = $('#fName').value.trim(), unit = $('#fUnit').value.trim();
  const byW = !!($('#fByW') && $('#fByW').checked);
  if(!name){ $('#fErr').textContent='Dê um nome ao produto.'; $('#fName').focus(); return; }
  let e;
  if(byW){
    const r = readTrio('fPrice');
    if(!r){ $('#fErr').textContent='Preencha o preço do kg, ou o peso e o total pago.'; $('#fPrice').focus(); return; }
    e = {...r, d:$('#fDate').value || today(), s:$('#fStore').value.trim()};
  } else {
    const v = parsePrice($('#fPrice').value);
    if(v===null){ $('#fErr').textContent='Digite o preço pago, ex.: 12,90'; $('#fPrice').focus(); return; }
    e = {p:v, d:$('#fDate').value || today(), s:$('#fStore').value.trim()};
  }

let scanTarget = 'global', zxingP = null, camStream = null, camReader = null, camTimer = null, camOn = false;
const FORMATS = ['ean_13','ean_8','upc_a'];
// Confere o dígito verificador (EAN-8, UPC-A, EAN-13, GTIN-14)
function validGTIN(code){
  if(!/^\d{8}$|^\d{12,14}$/.test(code)) return false;
  const d = code.split('').map(Number), check = d.pop();
  const sum = d.reverse().reduce((s, x, i) => s + x * (i % 2 === 0 ? 3 : 1), 0);
  return (10 - sum % 10) % 10 === check;
}
// UPC-A (12 dígitos) é o mesmo código que o EAN-13 com um 0 na frente
const sameCode = (a, b) => String(a||'').replace(/^0+/,'') === String(b||'').replace(/^0+/,'');
const READS_NEEDED = 2;
function loadZXing(){
  if(window.ZXing) return Promise.resolve(window.ZXing);
  if(!zxingP) zxingP = new Promise((res,rej)=>{
    const s=document.createElement('script'); s.src='zxing.min.js';
    s.onload=()=>window.ZXing?res(window.ZXing):rej(); s.onerror=()=>{zxingP=null;rej();};
    document.head.appendChild(s);
  });
  return zxingP;
}
function zxHints(Z){

}

}
function camMessage(html){ const m=$('#camMsg'); m.innerHTML = html || ''; m.hidden = !html; }
function camState(st){ const c = $('#cam'); c.classList.remove('scanning','found','done'); if(st) c.classList.add(st); }

let foundT = null;
let readLast = null, readCount = 0;
function candidate(raw){

    camOn = false; clearTimeout(camTimer); clearTimeout(foundT);
    camHint('✓ ' + code, true); $('#camTip').textContent = 'Código lido!';
    try{ navigator.vibrate && navigator.vibrate([40,40,90]); }catch(e){}
    const c = code; setTimeout(()=>gotCode(c), 550);
  } else {
    camState('found'); $('#camHintText').textContent = 'Código encontrado…';
    clearTimeout(foundT); foundT = setTimeout(()=>{ if(camOn){ camState('scanning'); $('#camHintText').textContent = 'Lendo código…'; readCount = 0; } }, 900);
  }
}
async function startScan(target){

  readLast = null; readCount = 0; camState(''); camHint('Abrindo a câmera…'); $('#camTip').textContent = 'Deixe o código dentro da moldura';
  const v = $('#camVideo');

  if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){

  }

  try{

    if(await hasNativeDetector()){

      tick();
    } else {
      const Z = await loadZXing();

      const hints = new Map(); hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.UPC_A]);

        if(!camOn) return;

          ctx.drawImage(v, x, y, w, h, 0, 0, cv.width, cv.height);
          try{
            const res = rd.decodeWithState(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(cv))));
            candidate(res.getText());
          }catch(e){}
        }
        if(camOn) camTimer = setTimeout(loop, 50);
      };
      loop();
    }
  }catch(e){
    camMessage('A câmera abriu, mas o leitor não carregou' + (e&&e.name?` (${esc(e.name)})`:'') + '. Toque em <b>Usar foto</b>.');
  }
}

function fileToCanvas(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{
      const max=1600, k=Math.min(1, max/Math.max(img.naturalWidth,img.naturalHeight));
      const c=document.createElement('canvas'); c.width=Math.round(img.naturalWidth*k); c.height=Math.round(img.naturalHeight*k);

    };

  });
}

  const {lat, lon} = nearCache;
  try{
    const j = await timedFetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&lat=${lat}&lon=${lon}&limit=20`, 9000);
    const out = [], seen = new Map();
    (j.features||[]).forEach(f => {
      const p = f.properties||{}, c = f.geometry && f.geometry.coordinates;
      if(!c || !/^(shop|amenity|leisure|tourism|healthcare|craft|office)$/.test(p.osm_key) || NOISE.test(p.osm_value)) return;
      addPlace(out, seen, lat, lon, p.name, c[1], c[0], 5000, SHOP_PT[p.osm_value]||'');
    });
    nameCache[q] = out.sort((a,b)=>a.d-b.d).slice(0,6);
  }catch(e){ nameCache[q] = []; }
  delete namePending[q];
  ['fStore','cmpStore','eeStore','rcStore'].forEach(id => { const el = document.getElementById(id); if(el && norm(el.value)===q) renderSuggest(id, false); });
}
let nameT = null;
function renderSuggest(inputId, loading){
  const inp = document.getElementById(inputId), out = document.querySelector(`[data-near-out="${inputId}"]`);
  if(!inp || !out) return;
  const q = norm(inp.value);
  const near = nearCache ? nearCache.list : [];
  const used = new Set(), picks = [];
  near.filter(m => !q || norm(m.name).includes(q) || norm(m.type).includes(q)).slice(0, q ? 6 : 5).forEach(m => { used.add(norm(m.name)); picks.push([m.name, m.d, m.type]); });
  if(q) savedStores().filter(s => norm(s.name).includes(q) && !used.has(norm(s.name))).slice(0,4).forEach(s => { used.add(norm(s.name)); picks.push([s.name, null]); });
  // poucos resultados perto: procura o nome digitado num raio de até 5 km
  let nameLoading = false;
  if(q.length >= 3 && picks.length < 3 && nearCache){
    if(nameCache[q]) nameCache[q].forEach(m => { if(!used.has(norm(m.name))){ used.add(norm(m.name)); picks.push([m.name, m.d, m.type]); } });
    else { nameLoading = true; clearTimeout(nameT); nameT = setTimeout(()=>searchByName(q), 450); }
  }
  // já digitou exatamente o único nome sugerido: não precisa sugerir
  let html = (picks.length===1 && norm(picks[0][0])===q) ? '' : picks.map(([n,d,t]) => chip(inputId, n, d, t)).join('');
  if(loading && !nearFresh()) html += '<span class="count">procurando perto…</span>';
  else if(nameLoading) html += `<span class="count">procurando “${esc(inp.value.trim())}” na região…</span>`;
  out.innerHTML = html;
}
let suggestT = null, geoGranted = null, nearFailT = 0;
async function geoAllowed(){
  if(geoGranted !== null) return geoGranted;
  try{ const p = await navigator.permissions.query({name:'geolocation'}); geoGranted = p.state === 'granted'; p.onchange = () => { geoGranted = p.state === 'granted'; }; }
  catch(e){ geoGranted = false; }
  return geoGranted;
}
function suggestFor(inputId, askLocation){
  renderSuggest(inputId, !nearFresh());
  if(nearFresh()) return;
  clearTimeout(suggestT);
  suggestT = setTimeout(async () => {
    if((!askLocation && !(await geoAllowed())) || Date.now()-nearFailT < 60000) { renderSuggest(inputId, false); return; }
    try{ await ensureNearby(); }catch(e){ nearFailT = Date.now(); }
    if(document.getElementById(inputId)) renderSuggest(inputId, false);
  }, askLocation ? 350 : 0);
}
document.addEventListener('focusin', ev => { const id = ev.target.id; if(id==='fStore' || id==='cmpStore' || id==='eeStore' || id==='rcStore') suggestFor(id, false); });
document.addEventListener('input', ev => { const id = ev.target.id; if(id==='fStore' || id==='cmpStore' || id==='eeStore' || id==='rcStore') suggestFor(id, true); });

/* ---------- Sugestão de produtos já cadastrados ao digitar o nome ---------- */
const normP = x => String(x||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
function renderNameSug(){
  const box = $('#fNameSug'), inp = $('#fName'); if(!box || !inp) return;
  const q = normP(inp.value);
  if(q.length < 2){ box.hidden = true; box.innerHTML = ''; return; }
  const words = q.split(/\s+/);
  const hits = [...items.values()].map(p => {
    const hay = normP([p.name, p.unit, p.ean].filter(Boolean).join(' '));
    if(!words.every(w => hay.includes(w))) return null;
    const n = normP(p.name);
    return {p, score: n===q ? 0 : n.startsWith(q) ? 1 : 2};
  }).filter(Boolean).sort((a,b)=> a.score-b.score || (a.p.name||'').localeCompare(b.p.name||'','pt-BR')).slice(0,5);
  if(!hits.length){ box.hidden = true; box.innerHTML = ''; return; }
  box.innerHTML = '<div class="sug-h">Já cadastrados: toque para usar</div>' + hits.map(({p}) => {
    const h = hist(p), last = h[h.length-1];
    return `<button type="button" data-pick-prod="${esc(p.id)}"><span class="n">${esc(p.name)}${p.unit?` <small>${esc(p.unit)}</small>`:''}</span><span class="v">${last?fmtU(last.p,p):''}</span></button>`;
  }).join('');
  box.hidden = false;
}

const WU_KEY = 'meusprecos.wu';
function lastWU(){ try{ return localStorage.getItem(WU_KEY) || 'kg'; }catch(e){ return 'kg'; } }
function parseNum(x){ x = String(x||'').replace(/[^\d,.]/g,''); if(x.includes(',')) x = x.replace(/\./g,'').replace(',','.'); const v = parseFloat(x); return isFinite(v) && v > 0 ? v : null; }
const unitOf = prod => prod && prod.byWeight ? '/kg' : '';
const fmtU = (v, prod) => fmt(v) + unitOf(prod);
const KG3 = new Intl.NumberFormat('pt-BR',{minimumFractionDigits:3,maximumFractionDigits:3});
const fmtW = w => w < 1 ? Math.round(w*1000) + ' g' : KG3.format(w) + ' kg';
const money2 = v => v.toFixed(2).replace('.', ',');
const TRIOS = {
  fPrice:  {kg:'fPrice',  w:'fW',   wu:'fWU',   t:'fT',   calc:'fCalc',   last:null},
  cmpPrice:{kg:'cmpPrice',w:'cmpW', wu:'cmpWU', t:'cmpT', calc:'cmpCalc', last:null},
  eePrice: {kg:'eePrice', w:'eeW',  wu:'eeWU',  t:'eeT',  calc:'eeCalc',  last:null}
};
function trioHTML(key, label, e){
  const ids = TRIOS[key]; ids.last = null;
  const wu = lastWU();
  const wv = e && e.w ? (wu==='g' ? String(Math.round(e.w*1000)) : String(e.w).replace('.',',')) : '';
  return `<div class="field"><label for="${ids.kg}">${label}</label><div class="money"><span>R$</span><input id="${ids.kg}" data-trio="${key}" inputmode="decimal" placeholder="0,00" autocomplete="off" value="${e&&e.p?esc(money2(e.p)):''}"><span class="suf">/kg</span></div></div>
    <div class="row2">
      <div class="field"><label for="${ids.w}">Peso</label><div class="wrow"><input id="${ids.w}" data-trio="${key}" inputmode="decimal" placeholder="${wu==='g'?'500':'0,500'}" autocomplete="off" value="${esc(wv)}"><select id="${ids.wu}" data-trio="${key}" aria-label="Unidade do peso"><option value="kg"${wu==='kg'?' selected':''}>kg</option><option value="g"${wu==='g'?' selected':''}>g</option></select></div></div>
      <div class="field"><label for="${ids.t}">Total pago</label><div class="money sm"><span>R$</span><input id="${ids.t}" data-trio="${key}" inputmode="decimal" placeholder="0,00" autocomplete="off" value="${e&&e.t?esc(money2(e.t)):''}"></div></div>
    </div>
    <p id="${ids.calc}" class="count" style="margin:0">Preencha dois campos (preço do kg, peso ou total) e o app calcula o outro.</p>`;
}
function trioVals(key){
  const ids = TRIOS[key], kgEl = $('#'+ids.kg); if(!kgEl) return null;
  const wu = $('#'+ids.wu).value, w0 = parseNum($('#'+ids.w).value);
  return {kg: parseNum(kgEl.value), w: w0==null ? null : (wu==='g' ? w0/1000 : w0), t: parseNum($('#'+ids.t).value), wu};
}
function setAuto(id, val){ const el = $('#'+id); if(!el) return; el.value = val; el.dataset.auto = val ? '1' : ''; }
function trioCalc(key, changedId){
  const ids = TRIOS[key]; if(!$('#'+ids.kg)) return;
  const ch = changedId && $('#'+changedId);
  if(ch && changedId !== ids.wu){ ch.dataset.auto = ''; if(changedId===ids.kg) ids.last='kg'; if(changedId===ids.t) ids.last='t'; }
  if(changedId === ids.wu){ try{ localStorage.setItem(WU_KEY, $('#'+ids.wu).value); }catch(e){} }
  const isUser = id => { const el = $('#'+id); return !!(el && el.value && !el.dataset.auto); };
  let v = trioVals(key);
  const wText = w => v.wu==='g' ? String(Math.round(w*1000)) : w.toFixed(3).replace('.',',');
  if(changedId===ids.w || changedId===ids.wu){
    if(v.w){ if(ids.last==='t' && isUser(ids.t)) setAuto(ids.kg, money2(v.t/v.w)); else if(isUser(ids.kg)) setAuto(ids.t, money2(v.kg*v.w)); else if(isUser(ids.t)) setAuto(ids.kg, money2(v.t/v.w)); }
  } else if(changedId===ids.kg){
    if(v.kg && (v.w && (isUser(ids.w)))) setAuto(ids.t, money2(v.kg*v.w));
    else if(v.kg && isUser(ids.t)) setAuto(ids.w, wText(v.t/v.kg));
    else if(!v.kg && $('#'+ids.t).dataset.auto) setAuto(ids.t, '');
  } else if(changedId===ids.t){
    if(v.t && v.w && isUser(ids.w)) setAuto(ids.kg, money2(v.t/v.w));
    else if(v.t && isUser(ids.kg)) setAuto(ids.w, wText(v.t/v.kg));
    else if(!v.t && $('#'+ids.kg).dataset.auto) setAuto(ids.kg, '');
  }
  v = trioVals(key);
  const c = $('#'+ids.calc);
  if(c){ c.textContent = (v.kg && v.w && v.t) ? `${fmtW(v.w)} × ${fmt(v.kg)}/kg = ${fmt(v.t)}` : 'Preencha dois campos (preço do kg, peso ou total) e o app calcula o outro.'; }
}
function readTrio(key){
  const v = trioVals(key); if(!v) return null;
  let p = v.kg || (v.t && v.w ? v.t/v.w : null);
  if(!p) return null;
  p = Math.round(p*100)/100;
  const r = {p};
  if(v.w) r.w = Math.round(v.w*1000)/1000;
  if(v.t) r.t = Math.round(v.t*100)/100; else if(v.w) r.t = Math.round(p*v.w*100)/100;
  return r;
}
function clearTrio(key){ const ids = TRIOS[key]; [ids.kg, ids.w, ids.t].forEach(id => setAuto(id, '')); ids.last = null; trioCalc(key); }
function plainPriceHTML(id, label){ return `<div class="field"><label for="${id}">${label}</label><div class="money"><span>R$</span><input id="${id}" inputmode="decimal" placeholder="0,00" autocomplete="off"></div></div>`; }

    box.innerHTML = ev.target.checked ? trioHTML('fPrice','Preço do kg') : plainPriceHTML('fPrice','Preço pago');
    if(keep) $('#fPrice').value = keep;
  }
});

const RC_SMALL = new Set(['de','da','do','das','dos','e','com','sem','para','p/','c/','s/','em']);
function rcPretty(desc){
  let s = String(desc||'').replace(/[|_~"`´^]+/g,' ').replace(/\s+/g,' ').trim();
  s = s.replace(/\bC\/\s*/gi,'com ').replace(/\bS\/\s*/gi,'sem ').replace(/\bP\/\s*/gi,'para ');
  s = s.replace(/\b(\d+(?:[.,]\d+)?)\s*(KG|G|GR|ML|L|LT|LTS|M|UN|UND|CM|MM)\b/gi, (m,n,u) => n + ({GR:'g',LT:'L',LTS:'L',UND:'un',UN:'un',L:'L'}[u.toUpperCase()] || u.toLowerCase()));
  const words = s.split(' ');
  const out = words.map((w, i) => {
    if(/^\d/.test(w)) return w;                       // números e tamanhos ficam como estão
    const k = normP(w).replace(/[^a-z]/g,'');
    let full = RC_ABBR[k] || RC_ABBR[k + '_'];
    if(k === 'cond') full = /^(leite|leit|lte|lt|cr|creme|doce)$/.test(normP(words[i-1]||'')) ? 'condensado' : 'condicionador';
    const base = full || w.toLowerCase();
    if(i > 0 && RC_SMALL.has(base)) return base;
    if(/^(uht|pet|tv|usb|led)$/i.test(base)) return base.toUpperCase();
    return base.charAt(0).toUpperCase() + base.slice(1);
  });
  return out.join(' ').replace(/\s+/g,' ').trim();
}
// Nome da loja: tira CNPJ, IE e números; ignora endereço
function rcCleanStore(l){
  return String(l||'')
    .replace(/\d{2}\.?\d{3}\.?\d{3}\s*\/?\s*\d{4}\s*-?\s*\d{2}/g,' ')
    .replace(/\b(CNPJ|C\.N\.P\.J\.?|IE|I\.E\.?|INSC(R|RICAO|\.)?\s*(EST(ADUAL)?)?|CPF|IM|NIRE)\b\.?\s*:?/gi,' ')
    .replace(/[\d:;#*=]+/g,' ')
    .replace(/\b(LTDA|EIRELI|ME|EPP|S\/?A|S\.A\.?|SA|CIA|COMERCIO|COM\.?|IND(USTRIA)?|DE ALIMENTOS|ALIMENTOS|VAREJISTA|ATACADISTA|DISTRIBUIDORA)\b\.?/gi,' ')
    .replace(/[-–,./]+\s*$/,'').replace(/^\s*[-–,./]+/,'').replace(/\s+/g,' ').trim();
}
const RC_ADDR = /\b(av|av\.|avenida|rua|r\.|rod|rodovia|br-?\d|ce-?\d|cep|bairro|fone|tel|telefone|loja\s*\d|centro|km\s*\d|n[ºo°]\s*\d|s\/n)\b/i;
function rcPickStore(lines){
  const stop = lines.findIndex(l => /danfe|documento auxiliar|nfc-?e|c[oó]digo\s+descri/i.test(l));
  const zone = lines.slice(0, stop > 0 ? Math.min(stop, 8) : 6);
  for(const l of zone){
    if(RC_ADDR.test(l)) continue;
    const c = rcCleanStore(l);
    if((c.match(/[A-Za-zÀ-ú]{2,}/g)||[]).length >= 1 && c.replace(/[^A-Za-zÀ-ú]/g,'').length >= 4) return rcPretty(c);
  }
  return '';
}
// CNPJ válido (com dígitos verificadores)
function rcValidCNPJ(c){
  if(!/^\d{14}$/.test(c) || /^(\d)\1+$/.test(c)) return false;
  const calc = n => { const w = n === 12 ? [5,4,3,2,9,8,7,6,5,4,3,2] : [6,5,4,3,2,9,8,7,6,5,4,3,2]; const s = w.reduce((a, x, i) => a + x * +c[i], 0); const r = s % 11; return r < 2 ? 0 : 11 - r; };
  return calc(12) === +c[12] && calc(13) === +c[13];
}
function rcFindCNPJ(text){
  const t = String(text||'').replace(/[Oo](?=[\d.\/-]*\d)/g,'0');
  const re = /(\d{2})\s*\.?\s*(\d{3})\s*\.?\s*(\d{3})\s*\/?\s*(\d{4})\s*-?\s*(\d{2})/g; let m;
  while((m = re.exec(t))){ const c = m.slice(1).join(''); if(rcValidCNPJ(c)) return c; }
  return '';
}
// Consulta o cadastro público da Receita (BrasilAPI); guarda no aparelho pra não consultar de novo
const CNPJ_KEY = 'meusprecos.cnpj';
async function rcStoreFromCNPJ(cnpj){
  if(!cnpj || IN_CLAUDE) return '';
  let cache = {}; try{ cache = JSON.parse(localStorage.getItem(CNPJ_KEY)||'{}'); }catch(e){}
  if(cache[cnpj]) return cache[cnpj];
  const generic = /^(matriz|filial|loja\s*\d*|dire[cç][aã]o geral|sede|unidade\s*\d*|-|\*+)$/i;
  for(const url of [`https://brasilapi.com.br/api/cnpj/v1/${cnpj}`, `https://publica.cnpj.ws/cnpj/${cnpj}`]){
    try{
      const j = await timedFetch(url, 7000);
      const fant = String(j.nome_fantasia || (j.estabelecimento && j.estabelecimento.nome_fantasia) || '').trim();
      const razao = String(j.razao_social || '').trim();
      let name = fant && !generic.test(fant) ? fant : rcCleanStore(razao);
      name = name.replace(/\s*[-–]\s*(loja|filial|unid(ade)?)\s*\d+.*$/i,'').trim();
      if(name){ name = rcPretty(name); cache[cnpj] = name; try{ localStorage.setItem(CNPJ_KEY, JSON.stringify(cache)); }catch(e){} return name; }
    }catch(e){}
  }
  return '';
}
// Aprende com as suas correções: descrição da nota → nome/produto que você escolheu
const RCMAP_KEY = 'meusprecos.rcmap';
function rcMapGet(){ try{ return JSON.parse(localStorage.getItem(RCMAP_KEY)||'{}'); }catch(e){ return {}; } }
function rcMapKey(desc){ return normP(desc).replace(/[^a-z0-9]+/g,' ').trim(); }
function rcLearn(pairs){

/* ---------- Leitura de cupom fiscal (NFC-e) a partir do texto ---------- */
const RC_UNITS = 'UN|UND|UNID|KG|KGS|G|GR|L|LT|ML|PC|PCT|CX|FD|DZ|M|BD|SC|FR|TB|VD|LA|PT|BJ|BAN|GL|RL|KT|PR|CJ|SACO|POTE';
const RC_QTY = new RegExp('(\\d{1,4}(?:[.,]\\d{1,3})?)\\s*(' + RC_UNITS + ')\\b\\.?\\s*(?:[xX×*]\\s*)?(\\d{1,5}[.,]\\d{2,3})\\s+(\\d{1,6}[.,]\\d{2})\\b', 'i');
const RC_STOP = /(qtd\.?|quantidade)\s*(total\s*)?de\s*itens|valor\s*total|total\s*r\$|^total\b|forma\s*(de\s*)?pagamento|valor\s*a\s*pagar|valor\s*pago|troco|tributos|consulte\s*pela|chave\s*de\s*acesso/i;
const RC_HEAD = /c[oó]d(igo)?\.?\s+.*descri/i;
function rcNum(x){
  x = String(x||'').trim();
  if(x.includes(',') && x.includes('.')) x = x.replace(/\./g,'');
  const v = parseFloat(x.replace(',', '.'));
  return isFinite(v) ? v : null;
}
function rcTitle(s){
  const keepUpper = /^(UHT|PET|LT|ML|KG|G|L|UN|DVD|USB|TV|LED)$/i;
  return String(s||'').toLowerCase().replace(/\s+/g,' ').trim()
    .split(' ').map(w => /^\d/.test(w) ? w : (keepUpper.test(w) && w.length<=3 ? w.toUpperCase() : w.charAt(0).toUpperCase() + w.slice(1))).join(' ')
    .replace(/\b(\d+)\s?(Kg|KG|G|Ml|ML|L|Lt|LT)\b/g, (m,n,u)=> n + u.toLowerCase());
}
function rcSplitDesc(desc){
  let d = String(desc||'').replace(/\s+/g,' ').trim();
  d = d.replace(/^\d{1,3}\s+(?=\S)/, m => (/^\d{1,3}\s+\d{4,}/.test(d) ? '' : m)); // nº do item antes do código
  let code = '';
  const m = d.match(/^(\d{4,14})\s+(.*)$/);
  if(m){ code = m[1]; d = m[2]; }
  d = d.replace(/^\d{1,3}\s+/, '');           // sobra de nº do item
  d = d.replace(/[|_~]+/g,' ').replace(/\s+/g,' ').trim();
  return {code, desc: d};
}
function parseReceiptText(text){
  const lines = String(text||'').split(/\r?\n/).map(l => l.replace(/\s+/g,' ').trim()).filter(Boolean);
  const res = {store:'', date:'', total:null, items:[], cnpj:''};
  // loja: primeira linha com nome (sem CNPJ, IE ou endereço); o CNPJ vai ser consultado depois
  const cnpjIdx = lines.findIndex(l => /cnpj/i.test(l));
  res.store = rcPickStore(lines);
  res.cnpj = rcFindCNPJ(text);
  // data da emissão
  const em = text.match(/emiss[aã]o[^\d]{0,20}(\d{2})\/(\d{2})\/(\d{4})/i) || text.match(/(\d{2})\/(\d{2})\/(20\d{2})/);
  if(em) res.date = `${em[3]}-${em[2]}-${em[1]}`;
  const tm = text.match(/valor\s*(total|a\s*pagar)[^\d]{0,15}(\d{1,6}[.,]\d{2})/i);
  if(tm) res.total = rcNum(tm[2]);
  // região dos itens
  let start = lines.findIndex(l => RC_HEAD.test(l));
  start = start >= 0 ? start + 1 : Math.max(0, cnpjIdx + 1);
  let pending = '';
  for(let i = start; i < lines.length; i++){
    const l = lines[i];
    if(RC_STOP.test(l)) break;
    const m = RC_QTY.exec(l);
    if(m){
      const before = l.slice(0, m.index).trim();
      const raw = /[A-Za-zÀ-ú]{2,}/.test(before) ? (pending && !/^\d{1,3}\s|^\d{4,}/.test(before) ? pending + ' ' + before : before) : (pending + (before ? ' ' + before : '')).trim();
      pending = '';
      const {code, desc} = rcSplitDesc(raw);
      if(!desc) continue;
      const qty = rcNum(m[1]), unit = m[2].toUpperCase(), up = rcNum(m[3]), total = rcNum(m[4]);
      res.items.push(rcItem(desc, code, qty, unit, up, total));
    } else if(/[A-Za-zÀ-ú]{2,}/.test(l)){
      const priceEnd = l.match(/^(.*[A-Za-zÀ-ú].*?)\s+(\d{1,6}[.,]\d{2})$/);
      const next = lines[i+1] || '';
      if(priceEnd && !RC_QTY.test(next)){
        const {code, desc} = rcSplitDesc((pending ? pending + ' ' : '') + priceEnd[1]);
        pending = '';
        const t = rcNum(priceEnd[2]);
        if(desc && t) res.items.push({...rcItem(desc, code, 1, 'UN', t, t), check:true});
      } else {
        pending = (/^\d{1,3}\s+\d{4,}|^\d{4,14}\s/.test(l) || !pending) ? l : pending + ' ' + l;
      }
    }
  }
  return res;
}
function rcItem(desc, code, qty, unit, up, total){
  const kg = /^(KG|KGS)$/.test(unit), g = /^(G|GR)$/.test(unit);
  const it = {desc, name: rcPretty(desc), ean: (code && validGTIN(code)) ? code : '', kg: kg || g, qty: qty || 1, unit, p: up, t: total, check:false};
  if(g){ it.qty = (qty||0)/1000; it.p = it.qty ? Math.round(total/it.qty*100)/100 : up; }
  if(it.kg) it.name = it.name.replace(/\s*\b(kg|kgs)\b\.?/gi,'').trim();
  if(it.qty && it.p && it.t && Math.abs(it.qty*it.p - it.t) > 0.02 + it.t*0.002){
    // um dos números veio errado: se total e quantidade batem com outro preço, corrige; senão marca pra conferir
    it.check = true;
  }
  return it;
}

/* ---------- Foto da nota fiscal: leitura e revisão ---------- */
let rcData = null, rcAppend = false, rcBusy = false;
function rcProgress(text){ const w = $('#scanWait'); w.hidden = !text; if(text) $('#scanWaitText').textContent = text; }

// No site: leitura de texto (OCR) grátis, no próprio aparelho
let tessP = null;
function loadTesseract(){
  if(window.Tesseract) return Promise.resolve(window.Tesseract);
  if(!tessP) tessP = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
    s.onload = () => window.Tesseract ? res(window.Tesseract) : rej(new Error('load'));
    s.onerror = () => { tessP = null; rej(new Error('load')); };
    document.head.appendChild(s);
  });
  return tessP;
}
function rcPrepImage(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(2, 1700 / img.naturalWidth, 4200 / img.naturalHeight);
      const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth*k); c.height = Math.round(img.naturalHeight*k);
      const ctx = c.getContext('2d', {willReadFrequently:true}); ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      // tons de cinza + contraste (papel térmico costuma vir apagado)
      const d = ctx.getImageData(0, 0, c.width, c.height), px = d.data, hist = new Uint32Array(256);
      for(let i = 0; i < px.length; i += 4){ const g = (px[i]*299 + px[i+1]*587 + px[i+2]*114) / 1000 | 0; px[i] = g; hist[g]++; }
      const n = px.length/4; let lo = 0, hi = 255, acc = 0;
      for(let v = 0; v < 256; v++){ acc += hist[v]; if(acc > n*0.02){ lo = v; break; } }
      acc = 0; for(let v = 255; v >= 0; v--){ acc += hist[v]; if(acc > n*0.02){ hi = v; break; } }
      const span = Math.max(1, hi - lo);
      for(let i = 0; i < px.length; i += 4){ const g = Math.max(0, Math.min(255, (px[i] - lo) * 255 / span)); px[i] = px[i+1] = px[i+2] = g; }
      ctx.putImageData(d, 0, 0); res(c);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}
async function rcReadWithOCR(files){
  rcProgress('Preparando o leitor… (na 1ª vez baixa uns arquivos)');
  const T = await loadTesseract();
  let stage = 'Baixando o leitor…';
  const worker = await T.createWorker('por', 1, {logger: m => {
    if(m.status === 'recognizing text') rcProgress(`${stage} ${Math.round((m.progress||0)*100)}%`);
    else if(/load|download/i.test(m.status||'')) rcProgress('Baixando o leitor (só na 1ª vez)… ' + Math.round((m.progress||0)*100) + '%');
  }});
  try{
    await worker.setParameters({tessedit_pageseg_mode: '6', preserve_interword_spaces: '1'});
    const out = {store:'', date:'', total:null, items:[], text:''};
    for(let i = 0; i < files.length; i++){
      stage = files.length > 1 ? `Lendo a nota (foto ${i+1} de ${files.length})…` : 'Lendo a nota…';
      rcProgress(stage);
      const c = await rcPrepImage(files[i]);
      const {data} = await worker.recognize(c);
      const r = parseReceiptText(data.text || '');
      out.text += (data.text || '') + '\n';
      out.store = out.store || r.store; out.date = out.date || r.date; out.total = out.total ?? r.total; out.cnpj = out.cnpj || r.cnpj;
      out.items.push(...r.items);
    }
    if(out.cnpj){ rcProgress('Buscando o nome da loja pelo CNPJ…'); const n = await rcStoreFromCNPJ(out.cnpj); if(n) out.store = n; }
    return out;
  } finally { try{ await worker.terminate(); }catch(e){} }
}

// No Claude: a IA do Claude lê a foto, usando o plano de quem está usando
const RC_PROMPT = `As imagens são fotos de um cupom fiscal brasileiro (NFC-e), possivelmente em partes. Transcreva TODOS os itens comprados.
Responda só com JSON neste formato:
{"loja":"nome fantasia ou razão social, sem LTDA/ME","data":"AAAA-MM-DD da emissão ou vazio","total":número ou null,
 "itens":[{"descricao":"texto do cupom","nome":"nome legível do produto, sem abreviações, com tamanho se houver (ex.: Leite Condensado Moça 395g)","codigo":"código de barras/EAN do item ou vazio","quantidade":número,"unidade":"UN ou KG etc.","preco_unitario":número,"total":número}]}
Regras: números com ponto decimal; item vendido por peso tem unidade KG, quantidade = quilos e preco_unitario = preço do kg; ignore descontos, sacolas só se não tiver preço, linhas de pagamento e tributos; se um item aparecer repetido em linhas diferentes, mantenha cada linha.`;
async function rcReadWithClaude(files){
  const sample = await window.claude.use('sample');
  if(!sample) throw {code:'not_granted'};
  const lim = await sample.limits().catch(() => null);
  if(!lim || !lim.images) throw {code:'images_unavailable'};
  const imgs = Array.from(files).slice(0, lim.images.maxCount || 4);
  rcProgress('O Claude está lendo a nota… (pode levar até 1 minuto)');
  const j = await sample.json(RC_PROMPT, {images: imgs, modelTier: 'default'});
  const n = v => { const x = typeof v === 'number' ? v : rcNum(v); return isFinite(x) && x > 0 ? x : null; };
  const out = {store: String(j && j.loja || '').trim(), date: /^\d{4}-\d{2}-\d{2}$/.test(j && j.data || '') ? j.data : '', total: n(j && j.total), items: []};
  (Array.isArray(j && j.itens) ? j.itens : []).forEach(x => {
    const unit = String(x.unidade || 'UN').toUpperCase();
    const it = rcItem(String(x.descricao || x.nome || ''), String(x.codigo || '').replace(/\D/g,''), n(x.quantidade) || 1, unit, n(x.preco_unitario), n(x.total));
    if(x.nome) it.name = String(x.nome).trim();
    if(!it.p && it.t && it.qty) it.p = Math.round(it.t / it.qty * 100) / 100;
    if(!it.t && it.p) it.t = Math.round(it.p * it.qty * 100) / 100;
    if(it.p) out.items.push(it);
  });
  return out;
}

async function handleReceiptFiles(files){
  if(!files || !files.length || rcBusy) return;
  rcBusy = true;
  let r = null, err = null;
  try{ r = IN_CLAUDE ? await rcReadWithClaude(files) : await rcReadWithOCR(files); }
  catch(e){ err = e; }
  rcBusy = false; rcProgress('');
  if(err){
    const c = err && err.code;
    toast(c==='not_granted' ? 'Permita o uso do Claude para ler a nota.'
      : c==='images_unavailable' ? 'Este app não consegue enviar imagens ao Claude aqui.'
      : c==='rate_limited' ? 'Limite de uso do Claude atingido. Tente mais tarde.'
      : c==='invalid_json' ? 'Não consegui entender a nota. Tente outra foto.'
      : (err && err.message==='load') ? 'Sem internet para baixar o leitor de notas.'
      : 'Não consegui ler a nota. Tente uma foto mais nítida.');
    if(!rcAppend) return;
  }
  if(r){
    if(rcAppend && rcData){
      rcSyncFromForm();
      rcData.items.push(...r.items.map(rcPrepItem));
      rcData.store = rcData.store || r.store; rcData.date = rcData.date || r.date; rcData.total = rcData.total ?? r.total;
    } else rcData = {store: r.store, date: r.date || today(), total: r.total, items: r.items.map(rcPrepItem)};
  }
  rcAppend = false;
  if(!rcData) return;
  if(!rcData.items.length){ toast('Não encontrei itens nessa foto. Tente mais de perto, com a nota reta e bem iluminada.'); }
  openReceiptReview();
}

// Liga cada item a um produto já cadastrado (pelo código ou pelo nome)
function rcTokens(s){ return normP(s).replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(w => w.length >= 3 && !/^\d+$/.test(w)); }
function rcScore(itemName, prodName){
  const a = rcTokens(itemName), b = rcTokens(prodName); if(!a.length || !b.length) return 0;
  let hit = 0; a.forEach(w => { if(b.some(x => x === w || x.startsWith(w) || w.startsWith(x))) hit++; });
  return hit / Math.max(a.length, Math.min(b.length, a.length + 1));
}
function rcCandidates(it){
  return [...items.values()].map(p => ({p, s: (it.ean && p.ean && sameCode(p.ean, it.ean)) ? 2 : rcScore(it.name + ' ' + it.desc, p.name + ' ' + (p.unit||''))}))
    .filter(x => x.s > 0.2).sort((a,b) => b.s - a.s).slice(0, 6);
}
function rcPrepItem(it){
  const learned = rcMapGet()[rcMapKey(it.desc)];
  if(learned){
    if(learned.id && items.has(learned.id)) return {...it, name: items.get(learned.id).name, on: true, match: learned.id, learned: true};
    if(learned.name) it = {...it, name: learned.name, learned: true};
  }
  const c = rcCandidates(it);
  return {...it, on: true, match: c.length && c[0].s >= 0.6 ? c[0].p.id : ''};
}
const rcMoney = v => v == null ? '' : money2(v);
function rcLineTotal(x){
  const calc = x.kg ? (x.qty && x.p ? x.qty*x.p : null) : (x.qty||1)*(x.p||0);
  if(x.t && calc != null && Math.abs(calc - x.t) < 0.03) return x.t;
  return calc != null ? Math.round(calc*100)/100 : (x.t || null);
}
function rcRowHTML(it, i){

  const rest = [...items.values()].filter(p => !opts.has(p.id)).sort((a,b) => (a.name||'').localeCompare(b.name||'','pt-BR'));
  if(rest.length) o += `<optgroup label="Outros produtos">` + rest.map(p => `<option value="${esc(p.id)}"${it.match===p.id?' selected':''}>${esc(p.name)}</option>`).join('') + `</optgroup>`;
  const tot = rcLineTotal(it);
  return `<div class="rc-item${it.on?'':' off'}${it.check?' warn':''}" data-rc="${i}">

      <select class="rc-match" id="rcMatch${i}" aria-label="Produto">${o}</select>

        <input id="rcQ${i}" inputmode="decimal" value="${esc(it.kg ? String(it.qty).replace('.',',') : String(it.qty||1).replace('.',','))}" aria-label="Quantidade ou peso">
        <span>×</span>

        <span class="rc-tot mono" id="rcT${i}">= ${tot ? fmt(tot) : '—'}</span>

function rcSyncFromForm(){
  if(!rcData) return;
  const st = $('#rcStore'), dt = $('#rcDate');
  if(st) rcData.store = st.value.trim(); if(dt) rcData.date = dt.value || today();
  rcData.items.forEach((it, i) => {
    const el = $('#rcName'+i); if(!el) return;
    it.name = el.value.trim(); it.match = $('#rcMatch'+i).value; it.kg = $('#rcKg'+i).value === 'kg';
    it.qty = parseNum($('#rcQ'+i).value) || (it.kg ? null : 1); it.p = parseNum($('#rcP'+i).value);
    it.on = $(`[data-rc-on="${i}"]`).checked;
  });
}
function rcSummary(){
  const on = rcData.items.filter(x => x.on);
  const sum = rcData.items.reduce((s, x) => x.on ? s + (rcLineTotal(x)||0) : s, 0);
  let cmp = '';
  if(rcData.total){ const diff = Math.round((sum - rcData.total)*100)/100; cmp = Math.abs(diff) < 0.05 ? ' · <b class="ok">bate com o total da nota ✓</b>' : ` · total da nota ${fmt(rcData.total)} (diferença ${fmt(Math.abs(diff))}, confira)`; }
  const el = $('#rcSum'); if(el) el.innerHTML = `${on.length} de ${rcData.items.length} itens · soma ${fmt(Math.round(sum*100)/100)}${cmp}`;
  const b = $('#rcSave'); if(b) b.textContent = on.length ? `Salvar ${on.length} ${on.length===1?'compra':'compras'}` : 'Nada marcado';
}
function openReceiptReview(){
  view = 'receipt'; openId = null;
  const engine = IN_CLAUDE ? 'Lido pelo Claude' : 'Lido no aparelho (pode errar: confira os números)';
  $('#sheet').innerHTML = `
    <div class="sheet-head"><div><h2 id="sheetTitle">Itens da nota</h2><p>${engine}</p></div><button class="x" type="button" data-close aria-label="Fechar">×</button></div>
    <div class="slip">
      <div class="field"><label for="rcStore">Onde</label>
        <div class="ean-row"><input id="rcStore" placeholder="Loja, restaurante, posto…" autocomplete="off" value="${esc(rcData.store||'')}"><button class="btn" type="button" data-near="rcStore">📍 Perto</button></div>
        <div class="near" data-near-out="rcStore" aria-live="polite"></div></div>
      <div class="field"><label for="rcDate">Data</label><input id="rcDate" type="date" value="${esc(rcData.date||today())}"></div>
    </div>
    <p id="rcSum" class="count" style="margin:0"></p>
    <div class="rc-list">${rcData.items.map(rcRowHTML).join('') || '<p class="count">Nenhum item encontrado.</p>'}</div>
    <div class="btn-col">
      <button id="rcSave" class="btn primary wide" type="button">Salvar</button>
      <button class="btn wide" type="button" data-rc-more>📷 Adicionar outra foto da nota</button>
      <button class="btn wide" type="button" data-close>Cancelar</button>
    </div>`;
  showSheet();
  rcSummary();
}
function rcUpdateRow(i){
  rcSyncFromForm();
  const it = rcData.items[i], row = document.querySelector(`[data-rc="${i}"]`);
  if(row) row.classList.toggle('off', !it.on);
  const tot = rcLineTotal(it);
  const t = $('#rcT'+i); if(t) t.textContent = '= ' + (tot ? fmt(tot) : '—');
  rcSummary();
}
function saveReceipt(){
  rcSyncFromForm();
  const on = rcData.items.filter(x => x.on);
  const bad = on.findIndex(x => !x.name || !x.p || (x.kg && !x.qty));
  if(bad >= 0){ toast('Confira o item ' + (rcData.items.indexOf(on[bad]) + 1) + ': falta nome, preço ou peso.'); const el = $('#rcName' + rcData.items.indexOf(on[bad])); if(el) el.focus(); return; }
  const d = rcData.date || today(), s = rcData.store || '';
  const touched = new Map(), learn = [];
  on.forEach(it => {
    const e = {p: Math.round(it.p*100)/100, d, s};
    if(it.kg){ e.w = Math.round(it.qty*1000)/1000; e.t = rcLineTotal(it); }
    else if(it.qty && it.qty !== 1){ e.q = it.qty; e.t = rcLineTotal(it); }
    let prod = it.match ? (touched.get(it.match) || items.get(it.match)) : null;
    if(!prod && !it.match){
      const key = 'new:' + normP(it.name);
      prod = touched.get(key);
      if(!prod){ prod = {id: newId(), name: it.name, unit: '', entries: [], updated: Date.now()}; if(it.ean) prod.ean = it.ean; if(it.kg) prod.byWeight = true; touched.set(key, prod); }
      prod.entries = [...prod.entries, e];
      if(it.desc) learn.push([it.desc, it.name, prod.id]);
      return;
    }
    if(!prod) return;
    const np = {...prod, entries: [...(prod.entries||[]), e], updated: Date.now()};
    if(!np.ean && it.ean && ![...items.values()].some(x => x.id !== np.id && x.ean && sameCode(x.ean, it.ean))) np.ean = it.ean;
    if(it.kg && !np.byWeight && !(prod.entries||[]).length) np.byWeight = true;
    touched.set(np.id, np);
    if(it.desc) learn.push([it.desc, np.name, np.id]);
  });
  touched.forEach(p => persist(p));
  rcLearn(learn);
  if(s && d === today()){ setTrip(s); learnPlace(s); }
  toast(`${on.length} ${on.length===1?'compra salva':'compras salvas'}`);
  rcData = null; closeSheet();
}
document.addEventListener('change', ev => {
  const t = ev.target;
  if(t.id === 'receiptFile' && t.files && t.files.length){ const f = Array.from(t.files); t.value = ''; handleReceiptFiles(f); return; }
  const on = t.dataset && t.dataset.rcOn; if(on != null){ rcUpdateRow(+on); return; }
  const m = t.id && t.id.match(/^rc(Kg|Match)(\d+)$/); if(m) rcUpdateRow(+m[2]);
});
document.addEventListener('input', ev => {
  const m = ev.target.id && ev.target.id.match(/^rc(Q|P|Name)(\d+)$/); if(m) rcUpdateRow(+m[2]);
});

/* ---------- Folha: abrir/fechar ---------- */
let lastFocus = null;
function showSheet(){ lastFocus = document.activeElement; $('#overlay').hidden = false; document.body.style.overflow='hidden'; }
function closeSheet(){ $('#overlay').hidden = true; document.body.style.overflow=''; view=null; openId=null; if(lastFocus && lastFocus.focus) try{lastFocus.focus()}catch(e){} }

let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),1800); }

/* ---------- Eventos ---------- */
document.addEventListener('click', ev=>{
  const t = ev.target;
  const open = t.closest('[data-open]'); if(open){ openDetail(open.dataset.open); return; }
  if(t.closest('[data-add]') || t.closest('#addBtn')){ openAdd(t.closest('[data-add]') ? query.trim() : ''); return; }
  if(t.closest('[data-close]') || t === $('#overlay')){ closeSheet(); return; }
  const s = t.closest('[data-sort]');
  if(s){ sortBy = s.dataset.sort; document.querySelectorAll('[data-sort]').forEach(b=>b.setAttribute('aria-pressed', b===s?'true':'false')); renderList(); return; }
  const pp = t.closest('[data-pick-prod]'); if(pp){ pickExisting(pp.dataset.pickProd); return; }
  if(t.closest('[data-receipt]')){ rcAppend = false; $('#receiptFile').click(); return; }
  if(t.closest('[data-rc-more]')){ rcSyncFromForm(); rcAppend = true; $('#receiptFile').click(); return; }
  if(t.closest('#rcSave')){ saveReceipt(); return; }
  if(t.closest('[data-edit-prod]')){ openEditProduct(); return; }
  const ee = t.closest('[data-edit-entry]'); if(ee){ openEditEntry(+ee.dataset.editEntry); return; }
  if(t.closest('[data-back]')){ openDetail(openId); return; }
  if(t.closest('#saveEditProd')){ saveEditProduct(); return; }
  if(t.closest('#saveEditEntry')){ saveEditEntry(); return; }
  const dee = t.closest('#delEditEntry');
  if(dee){
    if(dee.dataset.armed){ const p=items.get(openId); persist({...p, entries:(p.entries||[]).filter((_,k)=>k!==editIdx), updated:Date.now()}); toast('Compra apagada'); openDetail(p.id); }
    else { dee.dataset.armed='1'; dee.textContent='Toque de novo para apagar'; setTimeout(()=>{ if(dee.isConnected){ delete dee.dataset.armed; dee.textContent='Apagar esta compra'; } },3000); }
    return;
  }
  if(t.closest('[data-scan-edit]')){ startScan('edit'); return; }
  if(t.closest('#saveBuy')){ saveBuy(); return; }
  if(t.closest('#expBtn')){ exportBackup(); return; }
  const nb = t.closest('[data-near]'); if(nb){ findNear(nb.dataset.near); return; }
  const pk = t.closest('[data-pick]');
  if(pk){ const inp = document.getElementById(pk.dataset.pick); if(inp){ inp.value = pk.dataset.name; setTrip(pk.dataset.name); learnPlace(pk.dataset.name, pk.dataset.type); } const o = pk.parentElement; if(o) o.innerHTML=''; return; }
  if(t.closest('#scanBtn')){ startScan('global'); return; }
  if(t.closest('[data-scan-form]')){ startScan('form'); return; }
  if(t.closest('#camClose')){ stopCam(); return; }
  if(t.closest('#camPhoto')){ stopCam(); $('#scanFile').click(); return; }
  if(t.closest('#impBtn')){ $('#impFile').click(); return; }
  const de = t.closest('[data-del-entry]');
  if(de){
    if(de.dataset.armed){ const p=items.get(openId); const i=+de.dataset.delEntry; persist({...p, entries:(p.entries||[]).filter((_,k)=>k!==i), updated:Date.now()}); toast('Compra apagada'); }
    else { de.dataset.armed='1'; de.textContent='?'; de.setAttribute('aria-label','Toque de novo para apagar'); setTimeout(()=>{ if(de.isConnected){ delete de.dataset.armed; de.textContent='×'; } },2500); }
    return;
  }
  const dp = t.closest('#delProd');
  if(dp){
    if(dp.dataset.armed){ const id=openId; closeSheet(); removeProduct(id); toast('Produto excluído'); }
    else { dp.dataset.armed='1'; dp.textContent='Toque de novo para excluir'; setTimeout(()=>{ if(dp.isConnected){ delete dp.dataset.armed; dp.textContent='Excluir produto'; } },3000); }
  }
});
document.addEventListener('input', ev=>{
  if(ev.target.id==='q'){ query = ev.target.value; renderList(); }
  if(ev.target.id==='cmpPrice'){ $('#cmpErr').textContent=''; renderCmp(); }
});
document.addEventListener('change', ev=>{
  if(ev.target.id==='impFile' && ev.target.files[0]){ importBackup(ev.target.files[0]); ev.target.value=''; }
  if(ev.target.id==='fEan'){ autofill(ev.target.value.replace(/\s/g,'')); }
  if(ev.target.id==='scanFile' && ev.target.files[0]){ const f=ev.target.files[0]; ev.target.value=''; handlePhoto(f); }
});
document.addEventListener('submit', ev=>{ if(ev.target.id==='addForm') submitAdd(ev); });
document.addEventListener('keydown', ev=>{
  if(ev.key==='Escape' && !$('#cam').hidden){ stopCam(); return; }
  if(ev.key==='Escape' && !$('#overlay').hidden){ if(view==='editProduct' || view==='editEntry') openDetail(openId); else closeSheet(); }
  if(ev.key==='Enter' && ev.target.id==='cmpPrice'){ ev.preventDefault(); saveBuy(); }
});

init();
if(!IN_CLAUDE && 'serviceWorker' in navigator && location.protocol==='https:'){
  window.addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
})();
</script>
</body>
</html>
